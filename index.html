<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dexis · Asistente Personal + Universo 3D</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos base que ya tenías + el chat flotante */
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(5px);
            font-family: monospace;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            font-family: monospace;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            #info, #controls { font-size: 10px; padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <div id="info">
        🪐 Dexis · Asistente Personal
    </div>
    <div id="controls">
        ⌨️ E: Escuchar | M: Silenciar | R: Reset cámara | Di "Dexis" o "ayuda" si te pierdes
    </div>

    <!-- ============================================= -->
    <!-- CHAT DE TEXTO AGREGADO (sin borrar nada) -->
    <!-- ============================================= -->
    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." autocomplete="off" enterkeyhint="send">
            <button id="chat-send">Enviar</button>
        </div>
    </div>

    <script src="agents.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
