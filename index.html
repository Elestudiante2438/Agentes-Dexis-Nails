<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dexis · Asistente Personal + Universo 3D</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="shortcuts">⌨️ E: Escuchar | M: Silenciar | R: Reset cámara | Di "Dexis" o "ayuda" si te pierdes</div>
    <div id="statusMsg">⚪ Sistema listo</div>

    <!-- ========================================= -->
    <!-- CHAT DE TEXTO (agregado sin dañar nada) -->
    <!-- ========================================= -->
    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." autocomplete="off" enterkeyhint="send">
            <button id="chat-send">Enviar</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script src="/agents.js"></script>
    <script type="module" src="/main.js"></script>
</body>
</html>
